# Where users are permitted to run a discovery sweep.
#
# This is a governance control, not a technical one. Supply expansion is a
# commercial decision: a destination team is funded, briefed and resourced
# before anyone starts sourcing operators there. Letting any user sweep any
# country would spend API budget on markets nobody is ready to sell.
#
# Enabling a new market is a change to THIS FILE and nothing else. No code, no
# deploy of new logic. That is the same property the destination packs have,
# and it is what "scales to hundreds of destinations" has to mean in practice.
#
# Enforced in two places on purpose:
#   - the browser greys out and blocks unpermitted areas, so the control is
#     visible and nobody wastes time drawing a shape that will be refused
#   - the API re-checks every request, because a client-side gate is a courtesy
#     and not a security boundary
#
# The outlines are SIMPLIFIED administrative boundaries, generous on the
# seaward side so no offshore island is excluded, and reasonably tight on land
# borders so neighbouring capitals are not sweepable. They are fit for
# permissioning and are not survey data.

regions:
  - id: croatia
    name: Croatia
    status: enabled
    enabled_on: 2026-08-01
    note: >
      First market. Destination packs built for Split, Dubrovnik, Hvar, Zadar,
      Šibenik, Rovinj, Pula, Zagreb, Korčula, Omiš, Trogir and Makarska.
    # [lat, lng], traced clockwise from the north-west.
    polygon:
