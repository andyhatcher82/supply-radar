# Destination x category demand and bookable supply.
#
# SYNTHETIC. This is the one input only Viator can actually produce: demand
# comes from their own search logs (what travellers searched for in a
# destination and did not book), and bookable supply from their live catalogue.
# The numbers below are plausible rather than real, and the UI labels them as
# such wherever a gap-fit score is shown.
#
# Replacing this file with a query against Viator's search logs is the whole
# integration. Nothing else in the pipeline changes.

# Demand is an index where 100 is the strongest observed destination-category
# combination in the country.
demand_scale_max: 100

# Supply at which a category is considered adequately served, expressed as a
# fraction of its demand index. Below this there is unmet demand; at or above
# it, adding operators mostly cannibalises existing ones.
equilibrium_supply_ratio: 0.6

# Used where a destination-category pair is not listed below.
#
# Supply is deliberately set BELOW the equilibrium point (0.6 x 25 = 15), so an
# unknown cell scores a modest positive gap rather than zero. Sitting it exactly
# at equilibrium made every fallback score 0.00, which reads as "definitely no
# opportunity here" when the truth is "we do not know". Unknown and none are
# different answers and must not look the same.
default:
  demand: 25
  supply: 9

